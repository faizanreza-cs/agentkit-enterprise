[project]
name = "agentkit-enterprise"
version = "0.1.0"
description = "Production starter kit for enterprise AI agents: tool policies, human approvals, PII redaction, tamper-evident audit log, budgets, tracing and evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Reza" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.70",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
agentkit = "agentkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
