<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentkit console</title>
<style>
  :root {
    --bg: #fcfcfb; --panel: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --line: #e6e5e0;
    --accent: #2a78d6; --ok: #1a7f37; --warn: #9a6700; --bad: #c62828; --chip: #f3f3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a19; --panel: #232322; --ink: #f0efec; --ink2: #c3c2b7; --line: #3a3a38;
      --accent: #3987e5; --ok: #4ac26b; --warn: #d4a72c; --bad: #ff6b6b; --chip: #2d2d2b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px;
           align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
                  padding: 6px 8px; }
  main { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 14px; min-width: 0; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--ink2); font-weight: 600; }
  #log { display: flex; flex-direction: column; gap: 10px; max-height: 58vh; overflow: auto; }
  .msg { padding: 9px 12px; border-radius: 10px; max-width: 92%; white-space: pre-wrap; }
  .u { align-self: flex-end; background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
  .a { align-self: flex-start; background: var(--chip); }
  .meta { font-size: 12px; color: var(--ink2); margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .allowed, .approved { color: var(--ok); } .held { color: var(--warn); } .denied { color: var(--bad); }
  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 7px 12px;
           cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .ap { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .ap code { display: block; font-size: 12px; background: var(--chip); padding: 6px; border-radius: 6px;
             margin: 6px 0; overflow-x: auto; }
  .row { display: flex; gap: 8px; }
  #audit { font-size: 12px; color: var(--ink2); max-height: 26vh; overflow: auto; }
  .hint { color: var(--ink2); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>agentkit console</h1>
  <label>User <input id="user" value="alice" size="8"></label>
  <label>Role
    <select id="role">
      <option>support_agent</option><option>support_manager</option><option>viewer</option>
    </select>
  </label>
  <span class="hint">Try: “Look up Jane” · “Send Jane an email” · “Refund Maria”. Switch to
    user <b>bob</b> / <b>support_manager</b> to approve.</span>
</header>
<main>
  <section>
    <h2>Agent</h2>
    <div id="log" aria-live="polite"></div>
    <form id="f"><input id="q" placeholder="Ask the agent to do something…" aria-label="Message">
      <button>Run</button></form>
  </section>
  <section>
    <h2>Approvals (managers)</h2>
    <div id="approvals" class="hint">Switch to a manager role to see pending approvals.</div>
    <h2 style="margin-top:16px">Audit log</h2>
    <div id="verify" class="hint"></div>
    <div id="audit"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const headers = () => ({ "Content-Type": "application/json",
  "X-User-Id": $("user").value, "X-User-Role": $("role").value });

function bubble(cls, text, calls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  if (calls && calls.length) {
    const m = document.createElement("div");
    m.className = "meta";
    for (const c of calls) {
      const s = document.createElement("span");
      s.className = "chip " + c.decision;
      s.textContent = `${c.tool} · ${c.decision}${c.error ? " · error" : ""}`;
      m.appendChild(s);
    }
    d.appendChild(m);
  }
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

async function refresh() {
  const isMgr = $("role").value === "support_manager";
  if (isMgr) {
    const aps = await (await fetch("/approvals", { headers: headers() })).json();
    const box = $("approvals");
    box.innerHTML = aps.length ? "" : "No pending approvals.";
    for (const a of aps) {
      const div = document.createElement("div");
      div.className = "ap";
      const title = document.createElement("div");
      title.innerHTML = `<b></b> requested by <span></span>`;
      title.querySelector("b").textContent = a.tool;
      title.querySelector("span").textContent = a.requested_by;
      const code = document.createElement("code");
      code.textContent = JSON.stringify(a.args, null, 1);
      const row = document.createElement("div");
      row.className = "row";
      for (const [label, ok] of [["Approve", true], ["Deny", false]]) {
        const b = document.createElement("button");
        b.textContent = label;
        if (!ok) b.className = "ghost";
        b.onclick = async () => {
          const r = await fetch(`/approvals/${a.id}`, { method: "POST", headers: headers(),
            body: JSON.stringify({ approve: ok, note: ok ? "approved in console" : "denied in console" }) });
          const body = await r.json();
          bubble("a", r.ok ? `[${body.status}] ${body.answer}` : `Error: ${body.detail}`, body.tool_calls);
          refresh();
        };
        row.appendChild(b);
      }
      div.append(title, code, row);
      box.appendChild(div);
    }
    const au = await (await fetch("/audit", { headers: headers() })).json();
    $("verify").textContent = au.verify.ok
      ? `Hash chain verified: ${au.verify.records} records, no tampering.`
      : `TAMPERING DETECTED at record ${au.verify.broken_at}`;
    $("audit").textContent = au.events.slice(-14).reverse()
      .map((e) => `${e.seq}  ${e.actor.padEnd(8)} ${e.event}`).join("\n");
    $("audit").style.whiteSpace = "pre";
  } else {
    $("approvals").textContent = "Switch to a manager role to see pending approvals.";
    $("verify").textContent = "Audit log is visible to managers.";
    $("audit").textContent = "";
  }
}

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("q").value.trim();
  if (!msg) return;
  $("q").value = "";
  bubble("u", `${$("user").value} (${$("role").value}): ${msg}`);
  const r = await fetch("/runs", { method: "POST", headers: headers(), body: JSON.stringify({ message: msg }) });
  const body = await r.json();
  bubble("a", r.ok ? `[${body.status}] ${body.answer}` : `Error: ${body.detail}`, body.tool_calls);
  refresh();
});
$("role").addEventListener("change", refresh);
refresh();
</script>
</body>
</html>
